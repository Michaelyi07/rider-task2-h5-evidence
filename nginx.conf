server {
    listen 80;
    server_name _;

    # H5 静态资源（Vite 构建产物），SPA 路由回退 index.html
    root /usr/share/nginx/html;
    index index.html;

    # 静态资源缓存（带 hash 的 assets）
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API 反代到 mock（compose 内服务名 mock；契约前缀 /api/v1 原样透传）
    location /api/ {
        proxy_pass http://mock:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    location / {
        try_files $uri /index.html;
    }

    # 安全基线：不在响应中泄露版本
    server_tokens off;
}
